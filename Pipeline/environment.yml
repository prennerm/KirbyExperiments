name: kirby_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy
  - pip:
      - pyboy==2.4.1
      - gymnasium==0.29.1
      - stable-baselines3==2.3.2
      - sb3-contrib==2.3.0
      - torch>=2.0.0
      - tensorboard
      - pyyaml
      - pandas
      - matplotlib
      - seaborn
      - scikit-image
      - mediapy
