# k_v3: Recurrent PPO + Lambda Discrepancy for Kirby
extends: base.yaml

paths:
  session_root: "experiments/kirby/k_v3"

total_timesteps: 10000000

env:
  module: "kirby_gym_env"
  class: "KirbyGymEnv"

model:
  type: "RecurrentPPOLD"
  policy: "CnnLstmPolicyLD"
  ld_coef: 0.1
  n_steps: 2048
  batch_size: 1024
  n_epochs: 4
