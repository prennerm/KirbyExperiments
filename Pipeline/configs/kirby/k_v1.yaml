# k_v1: Baseline PPO training for Kirby's Dream Land
# Equivalent to Pokemon v1 (non-recurrent PPO)

extends: base.yaml

paths:
  session_root: "experiments/kirby/k_v1"

env:
  module: "kirby_gym_env"
  class: "KirbyGymEnv"

model:
  type: "PPO"
  policy: "CnnPolicy"
  batch_size: 512
  n_epochs: 3
